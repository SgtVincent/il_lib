# @package _global_

arch_name: moe_flow_matching

horizon: 16
num_latest_obs: 2
deployed_action_steps: 8

module:
  _target_: il_lib.policies.MoEFlowMatchingPolicy
  prop_dim: 37
  prop_keys: 
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat

  feature_extractors:
    proprioception:
      _target_: il_lib.nn.common.MLP
      input_dim: ${module.prop_dim}
      hidden_dim: 512
      output_dim: 512
      hidden_depth: 2
      add_output_activation: true
    pcd:
      _target_: il_lib.nn.features.UncoloredPointNet
      n_coordinates: 3
      output_dim: 512
      hidden_dim: 512
      hidden_depth: 2

  feature_fusion_hidden_depth: 2
  feature_fusion_hidden_dim: 512
  feature_fusion_output_dim: 512
  feature_fusion_activation: relu
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: true

  action_dim: 23
  action_keys: ${robot.action_keys}
  action_key_dims: ${robot.action_key_dims}
  num_latest_obs: ${num_latest_obs}
  deployed_action_steps: ${deployed_action_steps}
  horizon: ${horizon}

  num_flow_steps_per_inference: 16

  moe_num_experts: 4
  moe_top_k: 2
  moe_expert_hidden_dim: 512
  moe_expert_hidden_depth: 2
  moe_gating_hidden_dim: 256
  moe_gating_hidden_depth: 1
  moe_activation: silu
  moe_gating_temperature: 1.0

  optimizer: adam

data:
  use_action_chunks: false
  visual_obs_types: [pcd]
  use_task_info: false
