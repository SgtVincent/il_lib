# @package _global_
# Minimal flow-matching MTILValidationPolicy config for proprio+task only.
# - No skill_one_hot (avoids KeyError with plain BehaviorIterableDataset)
# - Small network sizes for cheap ablation runs
# - horizon 16, num_latest_obs 2, deployed_action_steps 8
arch_name: mt_il_validation_flow_minimal

horizon: 16
num_latest_obs: 2
deployed_action_steps: 8

module:
  _target_: il_lib.policies.MTILValidationPolicy
  prop_keys:
    - odom/base_velocity
    - qpos/torso
    - qpos/left_arm
    - qpos/left_gripper
    - qpos/right_arm
    - qpos/right_gripper
    - eef/left_pos
    - eef/left_quat
    - eef/right_pos
    - eef/right_quat
  feature_extractors:
    proprioception:
      _target_: il_lib.nn.common.MLP
      input_dim: 37
      hidden_dim: 256
      output_dim: 256
      hidden_depth: 1
      add_output_activation: true
    task:
      _target_: il_lib.nn.common.MLP
      input_dim: 58
      hidden_dim: 256
      output_dim: 256
      hidden_depth: 1
      add_output_activation: true
  feature_fusion_hidden_depth: 1
  feature_fusion_hidden_dim: 256
  feature_fusion_output_dim: 256
  feature_fusion_activation: relu
  feature_fusion_add_input_activation: false
  feature_fusion_add_output_activation: true
  action_expert_type: flow_matching
  action_dim: 23
  action_keys: ${robot.action_keys}
  action_key_dims: ${robot.action_key_dims}
  num_latest_obs: ${num_latest_obs}
  deployed_action_steps: ${deployed_action_steps}
  horizon: ${horizon}
  num_flow_steps_per_inference: 16
  moe_num_experts: 2
  moe_top_k: null
  moe_expert_hidden_dim: 256
  moe_expert_hidden_depth: 1
  moe_gating_hidden_dim: 128
  moe_gating_hidden_depth: 1
  moe_activation: silu
  moe_gating_temperature: 1.0
  optimizer: adam

data:
  use_action_chunks: false
  visual_obs_types: []
  use_task_info: true
